<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Pedidos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-100 text-stone-800 border-stone-200">
    <!-- Barra de navegación -->
    <header class="bg-white border-b border-stone-200">
        <nav class="mx-auto flex max-w-5xl items-center justify-between p-4">
            <span class="text-lg font-semibold">VMA</span>
            <ul class="hidden gap-6 text-sm sm:flex">
                <li><a href="#" class="text-orange-600">Pedidos</a></li>
                <li><a href="#" class="hover:text-orange-600">Clientes</a></li>
                <li><a href="#" class="hover:text-orange-600">Catalogos</a></li>
            </ul>
            <button class="rounded-lg bg-stone-800 px-4
                            py-2 text-sm tex-white hover:bg-stone-700">
                Nuevo Pedido
            </button>
        </nav>
    </header>

    <main class="mx-auto max-w-5xl space-y-8 p-4 py-8">
        <h1 class="text-3xl font-semibold text-stone-800">Pedidos de la Semana</h1>

        <!--Indicadores: 1 columnapara movil, 3 para pantalla grande -->
        <section class="grid gap-4 sm:grid-cols-3">
            <article class="rounded-xl border-stone-200 bg-white p-5">
                <p class="text-sm text-stone-500">En Producción</p>
                <p class="mt-1 text-3xl font-semibold text-blue-600">18</p>
            </article>
            <article class="rounded-xl border border-stone-200 bg-white p-5">
                <p class="text-sm text-stone-500">Por Entregar</p>
                <p class="mt-1 text-3xl font-semibold text-cyan-600">5</p>
            </article>
            <article class="rounded-xl border border-stone-200 bg-white p-5">
                <p class="text-sm text-stone-500">Entregados</p>
                <p class="mt-1 text-3xl font-semibold text-green-600">45</p>
            </article>
        </section>

        <!--Tabla-->
        <section class="overflow-x-auto rounded-xl border border-stone-200 bg-white">
            <table class="w-full text-left text-sm">
                <thead class="border-b border-stone-200 text-stone-500">
                    <tr>
                        <th class="p-4 font-medium">Folio</th>
                        <th class="p-4 font-medium">Cliente</th>
                        <th class="p-4 font-medium">Etapa</th>
                        <th class="p-4 font-medium">Entrega</th>
                    </th>
                </thead>
                <tbody class="divide-y divide-stone-100">
                    <tr class="hover:bg-stone-50">
                        <td class="p-4 font-medium">1045</td>
                        <td class="p-4">Casa Talavera</td>
                        <td class="p-4">
                            <span class="rounded-full bg-fuchsia-100 px-3 py-1 text-fuchsia-800">Esmaltado</span>
                        </td>
                        <td class="p-4">14 oct</td>
                    </tr>
                    <tr class="hover:bg-stone-50">
                        <td class="p-4 font-medium">1046</td>
                        <td class="p-4">Ana Rivera</td>
                        <td class="p-4">
                            <span class="rounded-full bg-blue-100 px-3 py-1 text-blue-800">Modelado</span>
                        </td>
                        <td class="p-4">20 oct</td>
                    </tr>
                    <tr class="hover:bg-stone-50">
                        <td class="p-4 font-medium">1047</td>
                        <td class="p-4">Vanessa Mendez</td>
                        <td class="p-4">
                            <span class="rounded-full bg-green-100 px-3 py-1 text-green-800">Empaque</span>
                        </td>
                        <td class="p-4">25 oct</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <!--Formulario-->
        <section class="rounded-xl border border-stone-200 bg-white p-6">
            <h2 class="text-xl font-semibold">Registrar Pedido</h2>
            <form class="mt-4 grid gap-4 sm:grid-cols-2">
                <div>
                    <label for="Cliente" class="block text-sm text-stone-600">Cliente</label>
                    <input id="Cliente" type="text"
                        class="mt-1 w-full rounded-lg border
                        border-stone-300 p-2 hover:border-orange-600 focus:outline-none">
                </div>
                <div>
                    <label for="Piezas" class="block text-sm text-stone-600">Piezas</label>
                    <input id="Piezas" type="number" min="1" value="1"
                        class="mt-1 w-full rounded-lg border
                        border-stone-300 p-2 hover:border-orange-600 focus:outline-none">
                </div>
                <div class="sm:col-span-2 sm:text-right text-center"></div>
                <button class="rounded-lg bg-orange-600 px-5 py-2 text-white hover:bg-orange-700">
                    Guardar
                </button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
